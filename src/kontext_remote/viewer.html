<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontext 学習結果</title>
<style>
:root{color-scheme:light;font-family:system-ui,sans-serif;background:#f4f6f8;color:#17202b}body{max-width:1160px;margin:36px auto;padding:0 24px}h1{font-size:28px;margin-bottom:6px}p{color:#5b6572;line-height:1.7}header{display:flex;align-items:center;justify-content:space-between;gap:20px}button,select{font:inherit;background:white;border:1px solid #cbd2da;border-radius:8px;padding:10px 14px}main{display:grid;grid-template-columns:270px 1fr;gap:20px;margin-top:24px}.panel{background:white;border:1px solid #dce1e7;border-radius:12px;padding:20px;min-width:0}#jobs{display:flex;flex-direction:column;gap:8px}#jobs button{text-align:left;cursor:pointer}#jobs button.active{border-color:#156fbd;background:#eef6ff}small{display:block;color:#687482;margin-top:5px}.state{font-weight:600}canvas{display:block;width:100%;height:280px;margin-top:18px}pre{background:#111c29;color:#dce8f5;padding:18px;border-radius:8px;overflow:auto;max-height:420px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6}.legend{font-size:14px;color:#65707d}.legend span{margin-right:18px}h2{font-size:18px;margin-top:0}details{margin-top:18px}#message{padding:15px 0}.hint{font-size:13px}@media(max-width:760px){main{grid-template-columns:1fr}body{padding:0 12px}header{align-items:flex-start}canvas{height:220px}}
</style>
<header><div><h1>Kontext 学習結果</h1><p>保存した学習ログとlossを確認できます。EC2の停止中も閲覧できます。</p></div><button id="refresh">更新</button></header>
<p class="hint">表示はこのPCに取得した時点の記録です。PCがオフの間の最終結果は、次回取得後に反映されます。</p>
<main><aside class="panel"><h2>学習ジョブ</h2><div id="jobs"></div></aside><section class="panel"><div id="message">ジョブを選択してください。</div><div id="result" hidden><h2 id="title"></h2><div id="summary"></div><small id="sync"></small><canvas id="chart"></canvas><p class="legend"><span style="color:#156fbd">● train loss</span><span style="color:#cb6334">● validation loss</span></p><section id="visual" hidden><h2>画像評価</h2><p class="hint">入力・正解・ベースモデル・学習後を比較できます。画像をクリックすると拡大します。</p><select id="boards"></select><a id="board-link" target="_blank" rel="noopener"><img id="board-image" alt="学習画像の比較" style="width:100%;margin:16px 0;border:1px solid #ddd"></a></section><h2>実行ログ</h2><pre id="log"></pre><details><summary>学習設定</summary><pre id="config"></pre></details><details><summary>保存ファイル</summary><pre id="files"></pre></details></div></section></main>
<script>
let selected=null,current=null,jobs=[];
const labels={completed:'完了',failed:'エラー終了',cancelled:'キャンセル',running:'学習中',submitted:'受付済み',not_cached:'取得待ち',submission_failed:'投入失敗'};
const el=id=>document.getElementById(id);
async function refresh(){try{const r=await fetch('/api/jobs');jobs=await r.json();el('jobs').replaceChildren();if(!jobs.length){el('message').textContent='学習ジョブはまだありません。学習後、取得した結果がここに表示されます。';return}if(!selected)selected=jobs[0].id;for(const j of jobs){let b=document.createElement('button');b.className=j.id===selected?'active':'';b.textContent=j.id.slice(0,12);let s=document.createElement('small');s.textContent=labels[j.state]||j.state;b.appendChild(s);b.onclick=()=>{selected=j.id;refresh()};el('jobs').appendChild(b)}const d=await(await fetch('/api/jobs/'+selected)).json();current=d;el('result').hidden=false;el('message').textContent='';el('title').textContent='ジョブ '+selected.slice(0,12);el('summary').textContent=(labels[d.status.state]||d.status.state||'取得待ち')+(d.status.exit_code!==undefined?' · 終了コード '+d.status.exit_code:'');const j=jobs.find(x=>x.id===selected);el('sync').textContent=j&&j.last_sync?'最終取得: '+new Date(j.last_sync*1000).toLocaleString('ja-JP'):'';el('log').textContent=d.log||'ログはまだ取得されていません。';el('config').textContent=JSON.stringify(d.config,null,2);el('files').textContent=d.files.join('\n');draw(d.metrics)}catch(e){el('message').textContent='結果を取得できませんでした。更新ボタンで再試行してください。'}}
function draw(metrics){const c=el('chart'),rect=c.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=rect.width*ratio;c.height=rect.height*ratio;const x=c.getContext('2d');x.scale(ratio,ratio);const w=rect.width,h=rect.height,p=48;let points=metrics.filter(v=>Number.isFinite(v.step)),values=points.flatMap(v=>[v.train_loss,v.val_loss]).filter(v=>typeof v==='number'&&Number.isFinite(v));if(!values.length){x.fillStyle='#687482';x.fillText('lossはまだ記録されていません。',p,h/2);return}let min=Math.min(...values),max=Math.max(...values);if(max===min)max=min+1;const lo=Math.min(...points.map(v=>v.step)),hi=Math.max(lo+1,...points.map(v=>v.step));x.font='11px system-ui';for(let i=0;i<=4;i++){let y=p+(h-2*p)*i/4;x.strokeStyle='#e3e8ed';x.beginPath();x.moveTo(p,y);x.lineTo(w-12,y);x.stroke();x.fillStyle='#687482';x.fillText((max-(max-min)*i/4).toPrecision(3),0,y+4)}x.fillText('step '+lo,p,h-12);x.fillText(String(hi),w-50,h-12);for(const [key,color]of[['train_loss','#156fbd'],['val_loss','#cb6334']]){x.strokeStyle=color;x.lineWidth=2;x.beginPath();let started=false;for(const v of points){if(typeof v[key]!=='number'||!Number.isFinite(v[key]))continue;const px=p+(w-p-12)*(v.step-lo)/(hi-lo),py=p+(h-2*p)*(max-v[key])/(max-min);if(started)x.lineTo(px,py);else{x.moveTo(px,py);started=true}}x.stroke()}}
let chosenBoard=null;function showBoards(){if(!current)return;if(!el('review-text')){let title=document.createElement('h2');title.textContent='学習後の診断';let text=document.createElement('pre');text.id='review-text';el('result').append(title,text)}el('review-text').textContent=current.ai_review||({'queued':'診断の開始待ちです。','running':'画像とログを診断しています。','failed':'診断を実行できませんでした。review/state.jsonを確認してください。','requires_codex':'Codex CLIの設定が必要です。'}[current.review_state?.state]||'診断レポートはまだありません。');const files=current.boards||[];el('visual').hidden=!files.length;const list=el('boards');list.replaceChildren();for(const path of files){let option=document.createElement('option');option.value=path;option.textContent=path.replace('training/evaluation/','');list.appendChild(option)}if(!files.includes(chosenBoard))chosenBoard=files.filter(x=>/epoch_\d+\.jpg$/.test(x)).at(-1)||files.at(-1);if(chosenBoard){list.value=chosenBoard;const url='/images/'+selected+'/'+chosenBoard.replace('training/evaluation/','');el('board-image').src=url;el('board-link').href=url}}el('boards').onchange=()=>{chosenBoard=el('boards').value;showBoards()};
const originalRefresh=refresh;refresh=async()=>{await originalRefresh();showBoards()};el('refresh').onclick=refresh;window.onresize=()=>current&&draw(current.metrics);refresh();setInterval(refresh,5000);
</script></html>
